<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>批量图片预览</title>
<style>
  body {
    font-family: Arial, "Microsoft YaHei", sans-serif;
    padding: 20px;
    background: #f5f5f5;
  }
  textarea {
    width: 100%;
    height: 180px;
    margin-bottom: 12px;
    font-size: 14px;
  }
  button {
    padding: 8px 14px;
    cursor: pointer;
    margin-bottom: 16px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
  }
  .card {
    background: #fff;
    border: 1px solid #ddd;
    padding: 8px;
    border-radius: 6px;
  }
  img {
    width: 100%;
    height: 180px;
    object-fit: contain;
    background: #eee;
    cursor: pointer;
  }
  .url {
    font-size: 12px;
    word-break: break-all;
    margin-top: 6px;
  }
</style>
</head>
<body>

<h2>批量图片预览</h2>

<textarea id="urlInput" placeholder="每行粘贴一个图片URL"></textarea>
<br>
<button onclick="renderImages()">展示图片</button>

<div class="grid" id="grid"></div>

<script>
function renderImages() {
  const input = document.getElementById('urlInput').value;
  const urls = input
    .split(/\n|,|\t/)
    .map(x => x.trim())
    .filter(x => x.startsWith('http'));

  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  urls.forEach((url, index) => {
    const card = document.createElement('div');
    card.className = 'card';

    card.innerHTML = `
      <div>序号：${index + 1}</div>
      <img src="${url}" loading="lazy" onclick="window.open('${url}', '_blank')" onerror="this.alt='加载失败'">
      <div class="url">${url}</div>
    `;

    grid.appendChild(card);
  });
}
</script>

</body>
</html>
